name: release-plugin

# Publishes a GitHub Release when a version tag (e.g. v1.0.1) is pushed. The
# tag is the source of truth; it must match the plugin manifest's Version.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: git-cliff builds changelog sections from them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: meta
        run: |
          dir=$(ls -d *.ulanziPlugin 2>/dev/null | head -1)
          if [ -z "$dir" ]; then echo "No .ulanziPlugin folder at the repository root" >&2; exit 1; fi
          manifest_version=$(jq -r .Version "$dir/manifest.json")
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$manifest_version" ]; then
            echo "Release version '$version' does not match manifest Version '$manifest_version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Built before the branch switch below so the artifact matches the tag,
      # not whatever the default branch has moved on to.
      - name: Build plugin zip(s)
        run: |
          found=0
          for dir in *.ulanziPlugin; do
            [ -d "$dir" ] || continue
            echo "Packaging $dir"
            zip -r "${dir}.zip" "$dir" -x "*.DS_Store"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "No .ulanziPlugin directory found at the repository root" >&2
            exit 1
          fi

      # CHANGELOG.md lives on the default branch, so generate and commit it
      # there rather than on the detached tag checkout.
      - name: Check out the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          version: 'v2.14.2'
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: .release-notes.md

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          version: 'v2.14.2'
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # git-cliff carries the last section's blank separator through to EOF;
          # the repository's pre-commit hook rejects a trailing blank line.
          printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already up to date"
          else
            git commit -m "update changelog for v$VERSION"
            git push origin "$BRANCH"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes-file .release-notes.md \
            --latest \
            *.ulanziPlugin.zip
