name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: me.iany.js.ulanziPlugin
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: node --test tests/
