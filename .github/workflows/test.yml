name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Node bundled with Ulanzi Studio; newer 20.x fixed the
          # Readable.toWeb teardown bug the proxy-fetch regression test guards.
          node-version: 20.12.2

      - name: Install dependencies
        working-directory: me.iany.js.ulanziPlugin
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: node --test tests/
