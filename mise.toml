[vars]
plugins_dir = '{{env.APPDATA}}\Ulanzi\UlanziDeck\Plugins'

[tasks."install:js"]
description = "Install me.iany.js.ulanziPlugin into UlanziDeck Plugins folder"
shell = "pwsh -NoProfile -Command"
run = '''
& './scripts/install-js.ps1' -PluginsDirectory '{{vars.plugins_dir}}'
'''

[tasks.install]
description = "Install all plugins into UlanziDeck Plugins folder"
depends = ["install:*"]

[tasks.bridge]
description = "Run the shared local server for all JS widgets"
run = "node me.iany.js.ulanziPlugin/bridge/server.cjs"

[tasks.ai-usage]
description = "Alias for the shared widget server"
depends = ["bridge"]
