# Changelog generation, run by .github/workflows/release.yml on every version tag.
#
# Commit subjects here mix informal imperatives ("add ...", "update ...") with the
# occasional Conventional Commit ("fix: ..."). Conventional parsing is left on so
# those prefixes are stripped from the rendered entries, while the groups below are
# keyed off the leading verb rather than the commit type.
#
# The repository slug is written out in the template rather than configured under
# [remote.github]: that section makes git-cliff fetch commit metadata over the
# GitHub API, which rate-limits and then panics even though no API field is used.

[changelog]
header = """
# Changelog

Notable changes are recorded here, newest first. Each section is generated from
the commit history by [git-cliff](https://git-cliff.org) when a version tag is
pushed.

"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% if previous.version %} ([Full Changelog](https://github.com/doitian/ulanzi-plugins/compare/{{ previous.version }}...{{ version }})){% endif %}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/doitian/ulanzi-plugins/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  # The release workflow commits the changelog itself; keep those out of it.
  { message = "^update changelog", skip = true },
  { message = "^feat|^add", group = "Features" },
  { message = "^fix|^harden", group = "Fixes" },
  { message = "^update|^change|^rename", group = "Changes" },
  { message = "^refactor|^organize", group = "Refactoring" },
  { message = "^doc|^readme", group = "Documentation" },
  { message = "^remove|^drop|^delete", group = "Removals" },
  { message = ".*", group = "Miscellaneous" },
]
