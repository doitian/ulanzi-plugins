<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
  <title>Clash Traffic Settings</title>
  <link rel="stylesheet" href="../../libs/css/uspi.css">
  <style>
    .pi-hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="uspi-wrapper hidden">
    <form id="property-inspector">

      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>WebSocket URL</div>
        <input type="text" class="uspi-item-value" name="wsUrl" placeholder="ws://127.0.0.1:9090/traffic">
      </div>

      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>API Token</div>
        <input type="text" class="uspi-item-value" name="token" placeholder="">
      </div>

      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Refresh Interval (s)</div>
        <input type="number" class="uspi-item-value" name="refreshInterval" min="1" max="60" step="1" placeholder="1">
      </div>
      <div class="pi-hint" data-localize>How often the chart samples and redraws. Intermediate frames are averaged.</div>

      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Online Press URL</div>
        <input type="text" class="uspi-item-value" name="onlineUrl" placeholder="https://example.com">
      </div>
      <div class="pi-hint" data-localize>URL to open when key is pressed while connected.</div>

      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Offline Press URL</div>
        <input type="text" class="uspi-item-value" name="offlineUrl" placeholder="">
      </div>
      <div class="pi-hint" data-localize>URL to open when key is pressed while service is offline.</div>

    </form>
  </div>

  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <script src="./inspector.js"></script>
</body>
</html>
