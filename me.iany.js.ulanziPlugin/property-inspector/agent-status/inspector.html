<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Agent Status Settings</title>
<link rel="stylesheet" href="../../libs/css/uspi.css">
<style>.pi-hint { font-size: 11px; color: #aaa; margin: 6px; }</style></head><body>
<div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label" data-localize>Agent</div>
<select class="uspi-item-value" name="agent"><option value="all" data-localize>All agents</option><option value="claude">Claude</option><option value="codex">Codex</option><option value="opencode">OpenCode</option><option value="grok">Grok</option><option value="pi">pi</option></select></div>
<div class="pi-hint" data-localize>All agents sums the sessions of every agent-berth provider.</div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Label</div><input class="uspi-item-value" type="text" name="label" maxlength="24"></div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Press URL</div><input class="uspi-item-value" type="url" name="url" placeholder="https://..."></div>
<div class="pi-hint" data-localize>Leave blank to only refresh the counts on press.</div>
<div class="pi-hint" data-localize>Sessions come from agent-berth and refresh every two seconds.</div>
</form></div>
<script src="../../libs/js/constants.js"></script>
<script src="../../libs/js/eventEmitter.js"></script>
<script src="../../libs/js/timers.js"></script>
<script src="../../libs/js/utils.js"></script>
<script src="../../libs/js/ulanziApi.js"></script>
<script src="./inspector.js"></script></body></html>
