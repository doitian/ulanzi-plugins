<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>AI Usage Settings</title>
<link rel="stylesheet" href="../../libs/css/uspi.css">
<style>.pi-hint { font-size: 11px; color: #aaa; margin: 6px; }</style></head><body>
<div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label" data-localize>Provider</div>
<select class="uspi-item-value" name="provider"><option value="codex">Codex</option><option value="claude">Claude</option><option value="opencode-go">OpenCode Go</option><option value="moonshot-cn">Moonshot China (CNY)</option><option value="moonshot">Moonshot (Kimi API)</option></select></div>
<div class="pi-hint" data-localize>Uses the active CLI account.</div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Usage window</div>
<select class="uspi-item-value" name="limit"><option value="rolling" data-localize>Rolling (5 hours)</option><option value="weekly" data-localize>Weekly</option><option value="monthly" data-localize>Monthly</option><option value="balance" data-localize>Balance</option><option value="five_hour" data-localize>5 hours</option><option value="seven_day" data-localize>7 days</option><option value="seven_day_fable" data-localize>7 days - Fable</option><option value="seven_day_sonnet" data-localize>7 days - Sonnet</option></select></div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Label</div><input class="uspi-item-value" type="text" name="label" maxlength="24"></div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Press URL</div><input class="uspi-item-value" type="url" name="url" placeholder="https://..."></div>
<div class="pi-hint" data-localize>Leave blank to open the provider's default usage page.</div>
<div class="pi-hint" data-localize>Usage refreshes automatically. Press to open the page and refresh.</div>
</form></div>
<script src="../../libs/js/constants.js"></script>
<script src="../../libs/js/eventEmitter.js"></script>
<script src="../../libs/js/timers.js"></script>
<script src="../../libs/js/utils.js"></script>
<script src="../../libs/js/ulanziApi.js"></script>
<script src="./inspector.js"></script></body></html>
