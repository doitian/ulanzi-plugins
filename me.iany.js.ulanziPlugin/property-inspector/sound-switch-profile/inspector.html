<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Sound Profile Settings</title>
<link rel="stylesheet" href="../../libs/css/uspi.css">
<style>.pi-hint { font-size: 11px; color: #aaa; margin: 6px; }</style></head><body>
<div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label" data-localize>Profile</div><input class="uspi-item-value" type="text" name="profile" list="sound-switch-profiles" maxlength="200" placeholder="Gaming"></div>
<datalist id="sound-switch-profiles"></datalist>
<div class="pi-hint" id="profile-status"></div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Icon</div><select class="uspi-item-value" name="icon"><option value="" data-localize>Profile</option><option value="playback" data-localize>Playback</option><option value="recording" data-localize>Recording</option><option value="mic" data-localize>Microphone</option></select></div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>Label</div><input class="uspi-item-value" type="text" name="label" maxlength="24" placeholder="PROFILE"></div>
<div class="uspi-item"><div class="uspi-item-label" data-localize>SoundSwitch CLI</div><input class="uspi-item-value" type="text" name="exe" placeholder="SoundSwitch.CLI.exe"></div>
<div class="uspi-item"><div class="uspi-item-label empty"></div><button class="uspi-item-value" type="button" id="browse" data-localize>Browse...</button></div>
<div class="uspi-item"><div class="uspi-item-label empty"></div><button class="uspi-item-value" type="button" id="reload-profiles" data-localize>Reload profiles</button></div>
<div class="pi-hint" data-localize>Leave blank to auto-detect SoundSwitch.CLI.exe in PATH or the scoop apps directory.</div>
<div class="pi-hint" data-localize>Press to activate the profile. The key marks it ACTIVE while it is the active SoundSwitch profile.</div>
</form></div>
<script src="../../libs/js/constants.js"></script>
<script src="../../libs/js/eventEmitter.js"></script>
<script src="../../libs/js/timers.js"></script>
<script src="../../libs/js/utils.js"></script>
<script src="../../libs/js/ulanziApi.js"></script>
<script src="../sound-switch/common.js"></script>
<script src="./inspector.js"></script></body></html>
